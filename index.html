<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- 💥 เคลียร์ Service Worker เก่าที่ค้างในมือถือ (ไม่ให้กระทบการโหลด) 💥 -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) { registration.unregister(); }
            });
        }
    </script>
    
    <!-- บังคับไม่ให้เบราว์เซอร์จำหน้าเว็บนี้ -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link class="apple-touch-icon" rel="apple-touch-icon" href="logo.jpg">
    
    <title>ระบบจัดการงานและแดชบอร์ดฝ่ายยุทธการ | Operations Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <style>
        .glass-card, .modal, .kanban-card, .metric-card, .chart-container, .table-container, 
        .form-container, .team-cards-container, .staff-header-profile, .detail-meta-info,
        #eventDescription, #mobileStaffProgressDisplay, .modal-backdrop {
            background-color: #1e293b !important; 
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5) !important;
        }

        body.light-theme .glass-card, body.light-theme .modal, body.light-theme .kanban-card,
        body.light-theme .metric-card, body.light-theme .chart-container, body.light-theme .table-container,
        body.light-theme .form-container, body.light-theme .team-cards-container, body.light-theme .staff-header-profile,
        body.light-theme .detail-meta-info, body.light-theme #eventDescription, body.light-theme #mobileStaffProgressDisplay {
            background-color: #ffffff !important;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1) !important;
        }

        .form-control { background-color: #0f172a !important; color: #f8fafc !important; border: 1px solid #475569 !important; }
        body.light-theme .form-control { background-color: #f1f5f9 !important; color: #0f172a !important; border: 1px solid #cbd5e1 !important; }

        #fullCalendarContainer { width: 100%; max-width: 100%; background: #ffffff !important; color: #000000 !important; border-radius: 8px; overflow: hidden; }
        .fc { width: 100% !important; max-width: 100% !important; }
        .fc .fc-scrollgrid { border-collapse: collapse !important; border-left-width: 0 !important; border-right-width: 0 !important; width: 100% !important; table-layout: fixed !important; }
        .fc .fc-view-harness { max-width: 100% !important; overflow: hidden !important; }
        .fc-scrollgrid-sync-table { width: 100% !important; table-layout: fixed !important; }
        
        .fc-daygrid-day-top { display: flex !important; justify-content: center !important; flex-direction: row !important; width: 100% !important; margin-top: 2px !important; }
        .fc-daygrid-day-number { font-size: 13px !important; font-weight: 700 !important; color: #1e293b !important; text-decoration: none !important; padding: 4px !important; width: 100% !important; text-align: center !important; }
        .fc-event-title { white-space: normal !important; line-height: 1.2 !important; font-weight: 500 !important; word-wrap: break-word !important; text-align: center !important; overflow: hidden !important; }
        .fc-daygrid-event { white-space: normal !important; padding: 2px !important; margin: 1px !important; border-radius: 4px !important; }
        .fc-col-header-cell-cushion { padding: 6px 2px !important; text-decoration: none !important; color: #1e293b !important; display: block !important; text-align: center !important; }

        .modal { width: 95% !important; max-width: 850px !important; }
        .modal-body { max-height: 70vh !important; overflow-y: auto !important; padding-right: 10px; }

        .filter-bar { display: flex !important; flex-wrap: wrap !important; gap: 15px !important; }
        .filter-group { flex: 1 1 120px !important; min-width: 100px !important; }
        .filter-group-search { flex: 2 1 250px !important; min-width: 200px !important; }

        @media (max-width: 768px) {
            #teamProgressTable { display: none !important; }
            #viewLeaderDashboard .table-header { display: none !important; }
            .table-responsive { overflow-x: auto !important; -webkit-overflow-scrolling: touch; padding-bottom: 10px; }
            .data-table { min-width: 800px !important; }
            .data-table th, .data-table td { white-space: nowrap !important; }
            .data-table td:first-child { white-space: normal !important; min-width: 250px !important; }

            .fc-event-title { font-size: 9px !important; line-height: 1.1 !important; }
            .fc-col-header-cell-cushion { font-size: 11px !important; font-weight: 700 !important; }
            .fc-daygrid-day-number { font-size: 11px !important; padding: 2px !important; } 
            
            .fc-header-toolbar { display: flex !important; flex-direction: column !important; gap: 8px !important; margin-bottom: 10px !important; }
            .fc-toolbar-chunk { display: flex !important; justify-content: center !important; width: 100% !important; flex-wrap: wrap; gap: 4px; }
            .fc .fc-toolbar-title { font-size: 1.1em !important; text-align: center !important; width: 100%; margin-bottom: 4px; }
            .fc .fc-button { padding: 5px 10px !important; font-size: 11px !important; margin: 0 2px !important; }
            
            #viewTeamCalendar .glass-card { padding: 8px !important; }
            
            .modal .form-row { display: flex !important; flex-direction: column !important; gap: 0 !important; }
            .modal .form-row .form-group { width: 100% !important; margin-bottom: 15px !important; }
            .modal-body { max-height: 65vh !important; }

            .filter-group { flex: 1 1 45% !important; }
            .filter-group-search { flex: 1 1 100% !important; }

            .detail-grid { display: flex !important; flex-direction: column !important; gap: 15px !important; }
            .detail-meta-info { order: -1 !important; width: 100% !important; margin-bottom: 10px !important; }
            .detail-main-info { width: 100% !important; }
            .detail-desc { max-height: 250px; overflow-y: auto; }
        }

        @media (min-width: 769px) {
            .mobile-staff-progress-box { display: none !important; }
            .fc-event-title { font-size: 11.5px !important; }
            .fc-col-header-cell-cushion { font-size: 13px !important; font-weight: 600 !important; }
            .fc-header-toolbar { display: flex !important; flex-direction: row !important; justify-content: space-between !important; margin-bottom: 1.5em !important; }
            .fc .fc-toolbar-title { font-size: 1.3em !important; }
            .fc .fc-button { padding: 6px 12px !important; font-size: 13px !important; }
        }
    </style>
</head>
